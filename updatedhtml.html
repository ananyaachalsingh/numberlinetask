<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Line Estimation Task</title>

  <!-- jsPsych 8.2.1 -->
  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <link href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css" rel="stylesheet">

  <!-- jsPsych plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>

  <!-- Your experiment -->
  <script src="experiment.js" defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: white;
    }

    body { font-family: Arial, sans-serif; }

    .instruction-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
      text-align: center;
      font-size: 20px;
      line-height: 1.6;
    }

    .instruction-page h1,
    .instruction-page h2 { margin-bottom: 25px; }

    .number-line-wrapper {
      width: min(95vw, 1800px);
      margin: 70px auto 0 auto;
    }

    .number-line {
      position: relative;
      width: 100%;
      height: 8px;
      background: black;
      cursor: crosshair;
      border-radius: 2px;
      box-sizing: border-box;
    }

    .endpoint {
      position: absolute;
      top: -42px;
      font-size: 22px;
      font-weight: bold;
      white-space: nowrap;
      user-select: none;
    }

    .left-endpoint { left: 0; }
    .right-endpoint { right: 0; }

    .instruction {
      font-size: 26px;
      margin-bottom: 25px;
      text-align: center;
    }

    .target-number {
      font-size: 38px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      user-select: none;
    }

    .click-marker {
      position: absolute;
      top: -18px;
      width: 4px;
      height: 44px;
      background: red;
      pointer-events: none;
      transform: translateX(-2px);
    }

    .trial-help {
      text-align: center;
      margin-top: 45px;
      font-size: 20px;
    }

    .break-page {
      max-width: 850px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
      font-size: 22px;
      line-height: 1.6;
    }

    .progress-text {
      margin-top: 20px;
      font-size: 17px;
      color: #555;
    }

    button.jspsych-btn {
      font-size: 18px;
      padding: 10px 24px;
    }
  </style>
</head>
<body></body>
</html>
